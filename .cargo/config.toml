# macOS 27 beta SDK rot: the SDK's baked clang-runtime search path points at
# the removed /Applications/Xcode.app (clang 17), so pyo3's `-lclang_rt.osx`
# cannot resolve. Point ld at the CommandLineTools clang-21 runtime, which
# exists. Harmless on machines where the SDK path is healthy.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-L/Library/Developer/CommandLineTools/usr/lib/clang/21/lib/darwin"]

# Homebrew Python 3.14 is newer than this pyo3 release's known-max version;
# the stable-ABI forward-compatibility build is fine for our use.
[env]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
