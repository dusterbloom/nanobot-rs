[package]
name = "nanobot"
version = "0.1.0"
edition = "2021"
description = "A lightweight personal AI assistant framework in Rust"
license = "MIT"
repository = "https://github.com/dusterbloom/nanobot-rs"
default-run = "nanobot"

# Error-protocol enforcement layer 3 — higgs-style deny regime
# (docs/research/2026-08-06-error-conventions-and-host-bridge.md §2.5/§3.6).
# Test code uses the sanctioned crate-root escape hatch in src/lib.rs:
# `#![cfg_attr(test, allow(...))]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
try_err = "deny"
string_add = "deny"
format_push_string = "deny"

[[bin]]
name = "nanobot"
path = "src/main.rs"

[[bin]]
name = "trio_bench"
path = "src/bin/trio_bench.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "blocking", "stream"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-chrome = { version = "0.7", optional = true }
tracing-tree = { version = "0.4", optional = true }

# Date/time
chrono = { version = "0.4", features = ["serde", "clock"] }

# Regex
regex = "1"

# Cryptographic hashing for audit log chain
sha2 = "0.10"

# Directories
dirs = "6"

# UUID
uuid = { version = "1", features = ["v4"] }

# Cron parsing
cron = "0.15"

# Byte buffers (used by reqwest streaming)
bytes = "1"

# Base64
base64 = "0.22"

# Faster, poison-free Mutex/RwLock
parking_lot = "0.12"

# HTML processing
scraper = "0.22"
html-escape = "0.2"
dom_smoothie = "0.15"
fast_html2md = "0.0.55"

# Async trait
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Retry with backoff
backon = { version = "1", features = ["tokio-sleep"] }

# REPL
rustyline = "15"

# Terminal markdown rendering
termimad = "0.30"

# Syntax highlighting for code blocks
syntect = "5"
once_cell = "1"

# Unicode display width (terminal column counting)
unicode-width = "0.2"

# Unix terminal control (stdin flush after voice recording)
libc = "0.2"

# URL parsing
url = "2"

# Language detection (only used by voice mode for TTS routing)
# Per-language features keep binary small: ~12MB for 8 langs vs ~110MB for all 75.
lingua = { version = "1.7", default-features = false, features = [
    "english", "spanish", "french", "hindi",
    "italian", "japanese", "portuguese", "chinese",
    "vietnamese",
], optional = true }

# Mime type guessing
mime_guess = "2"

# fp16 (half-precision) for ANE kernel I/O
half = { version = "2", optional = true }

# Data-parallel CPU gradient accumulation (overlaps with ANE evals)
rayon = { version = "1.10", optional = true }

# Memory-mapped file I/O for training data loader
memmap2 = { version = "0.9", optional = true }

# Accurate BPE token counting (cl100k_base, compatible with OpenAI/Claude)
tiktoken-rs = "0.6"

# SQLite with FTS5 (context store, budget calibrator, experience buffer)
rusqlite = { version = "0.32", features = ["bundled"] }

# Directed Acyclic Graph for reasoning plan decomposition
daggy = "0.8"

# Email channel (IMAP + SMTP)
async-imap = "0.10"
async-native-tls = "0.5"
tokio-util = { version = "0.7", features = ["compat"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
mail-parser = "0.9"
arc-swap = "1.8.2"
tempfile = "3"
mdns-sd = { version = "0.11", features = ["async"], optional = true }

# Semantic search: local ONNX embeddings + SQLite vector search
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"], optional = true }
sqlite-vec = { version = "0.1", optional = true }
zerocopy = { version = "0.7", features = ["derive"], optional = true }

# Knowledge graph (entity/relation store)
petgraph = { version = "0.8", features = ["serde-1"], optional = true }
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }
ratatui = "0.30"
ratatui-textarea = "0.9.2"

[dev-dependencies]

[features]
default = []
voice = ["dep:jack-voice", "dep:crossterm", "dep:lingua"]
trace-chrome = ["dep:tracing-chrome", "dep:tracing-tree"]
cluster = ["dep:mdns-sd"]
semantic = ["dep:fastembed", "dep:sqlite-vec", "dep:zerocopy"]
knowledge-graph = ["dep:petgraph"]
python-kernel = ["dep:pyo3"]

[dependencies.jack-voice]
git = "https://github.com/dusterbloom/jack-voice.git"
rev = "c9aef93a7c4a7cc8f22833c08da8b0985573ac2f"
optional = true

[patch.crates-io]

[patch."https://github.com/dusterbloom/jack-voice.git"]
jack-voice = { path = "../jack-voice/jack-voice" }

[dependencies.crossterm]
version = "0.28"
optional = true
