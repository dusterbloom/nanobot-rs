# Quality Gate enforcement via Clippy
# These thresholds are stricter than Clippy defaults to match our Quality Gates.
# See CLAUDE.md "Quality Gates" section for the reasoning.

# G1: Bool -> Enum — flag ANY bool parameter (default is 3, we want 1)
max-fn-params-bools = 1
max-struct-bools = 2

# G3: Nest -> Guard — cognitive complexity threshold (default 25, we want 15)
cognitive-complexity-threshold = 15

# G4: Grow -> Split — function length limit (default 100, we want 60)
too-many-lines-threshold = 60

# Error-protocol enforcement layer 2 (docs/research/2026-08-06-error-conventions-and-host-bridge.md §2.5):
# ban the legacy string-error channel and anyhow at tool boundaries.
disallowed-methods = [
    # The legacy string-error adapter (deleted in the error-protocol migration).
    # New code must construct ToolError variants; rendering happens once, at
    # the registry boundary.
    { path = "crate::agent::tools::base::ToolExecutionResult::from_output", reason = "legacy string-error adapter — migrate to ToolResult" },
    # Substring classification is fragile; return typed ToolError variants.
    { path = "crate::errors::classify_tool_error", reason = "string classification — produce ToolError at the source" },
    # Legacy callback slots on SpawnTool (deleted in Phase 3, host bridge
    # doc §3.7 Step 3) — the typed HostBridge trait replaced them. Entries are
    # inert (methods no longer exist) but block reintroducing a callback-
    # coupled tool.
    { path = "crate::agent::tools::spawn::SpawnTool::set_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    { path = "crate::agent::tools::spawn::SpawnTool::set_list_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    { path = "crate::agent::tools::spawn::SpawnTool::set_cancel_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    { path = "crate::agent::tools::spawn::SpawnTool::set_wait_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    { path = "crate::agent::tools::spawn::SpawnTool::set_check_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    { path = "crate::agent::tools::spawn::SpawnTool::set_pipeline_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    { path = "crate::agent::tools::spawn::SpawnTool::set_loop_callback", reason = "legacy callback slot — deleted in Phase 3; use HostBridge" },
    # Legacy send callback on MessageTool (deleted in Phase 3) — use MessageHost.
    { path = "crate::agent::tools::message::MessageTool::set_send_callback", reason = "legacy callback slot — deleted in Phase 3; use MessageHost" },
]

disallowed-types = [
    # No anyhow at the tool boundary.
    { path = "anyhow::Error", reason = "tool layer must return ToolResult; convert at the edge" },
]
